services:
  - type: web
    name: campus-ai
    env: node
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_COLLEGE_EMAIL_DOMAIN
        value: .edu.in

